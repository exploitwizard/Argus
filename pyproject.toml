[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-recon"
version = "0.1.0"
description = "ARGUS — Autonomous Recon & Guided Unified Scanner. An LLM-driven, six-phase recon agent for authorized bug bounty / pentest work."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sid" }]
keywords = ["recon", "bug-bounty", "pentest", "security", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "litellm>=1.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "keyring>=25.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
docx = ["python-docx>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
argus = "argus.cli:app"

[project.urls]
Homepage = "https://github.com/sid/argus"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.hatch.build.targets.wheel.force-include]
"argus/recipes" = "argus/recipes"
"argus/argus_skill.md" = "argus/argus_skill.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Core Pydantic V1 functionality:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
