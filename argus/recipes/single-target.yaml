# ARGUS recipe TEMPLATE — single-target
# Copy this and tune it for one engagement. Every ${param} is filled from
# `parameters` below, overridable at the CLI with --param key=value.
#   argus run single-target.yaml --target ${target} --scope ${scope_path}
name: single-target
description: Template for a single-target engagement — edit and re-use.
model: ${model}
intensity: ${intensity}
scope: ${scope_path}
phases: [1, 2, 3, 4, 5, 6]

flags:
  subfinder: ["-all"]

parameters:
  # Defaults — override any of these with --param key=value on the CLI.
  model: claude-sonnet-5
  intensity: med
  scope_path: scope.yaml
  wordlist: /usr/share/wordlists/dirb/common.txt
  resolvers: null
  nuclei_templates: null

retry:
  max_attempts: 1
  validate_output: true
